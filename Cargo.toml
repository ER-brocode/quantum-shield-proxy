[package]
name = "quantum-shield-proxy"
version = "0.1.0"
edition = "2021"
authors = ["koushik4475 <koushik4475@gmail.com>"]
description = "Production-grade Post-Quantum Cryptography (PQC) TLS 1.3 Reverse Gateway in Rust (FIPS 203 ML-KEM / Kyber768, FIPS 204 ML-DSA / Dilithium)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ER-brocode/quantum-shield-proxy"
keywords = ["post-quantum", "pqc", "tls13", "kyber768", "reverse-proxy"]
categories = ["cryptography", "network-programming"]

[dependencies]
# Post-Quantum Cryptography (NIST FIPS 203 & 204)
ml-kem = { version = "0.3.3", features = ["getrandom", "zeroize"] }
ml-dsa = { version = "0.1.1", features = ["getrandom", "zeroize", "rand_core"] }
hybrid-array = "0.4"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2 = "0.10"
hkdf = "0.12"
subtle = "2.5"
rand = "0.8"
rand_core = "0.6"

# TLS Engine & PKI
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls-pki-types = "1.10"
rustls-pemfile = "2.1"
rcgen = { version = "0.13", features = ["pem", "ring"] }

# Async Runtime & HTTP Reverse Proxy
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.6"
http = "1.1"
http-body-util = "0.1"
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }

# Configuration, CLI & Observability
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
anyhow = "1.0"
thiserror = "1.0"
parking_lot = "0.12"

[dev-dependencies]
tokio-test = "0.4"
